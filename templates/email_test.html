<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCK | Email Delivery Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:24px 16px;
  display:flex;align-items:center;justify-content:center;
  background:#0a0f0d;color:#f3f4f6;
  font-family:system-ui,-apple-system,sans-serif
}
.card{
  width:100%;max-width:440px;padding:28px;
  background:#121a16;border:1px solid #176e48;
  border-radius:24px;box-shadow:0 0 40px #00875118
}
.logo{
  width:58px;height:58px;border-radius:18px;
  background:#00875122;color:#34d399;
  display:grid;place-items:center;font-size:27px;
  font-weight:900;margin-bottom:18px
}
h1{font-size:25px;margin:0 0 8px}
.sub{color:#9ca3af;font-size:14px;line-height:1.6;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:700;margin:17px 0 8px}
input{
  display:block;width:100%;padding:14px;
  border-radius:12px;border:1px solid #34433a;
  background:#0a0f0d;color:#fff;font-size:15px;outline:none
}
input:focus{border-color:#008751}
button{
  width:100%;padding:15px;border:0;border-radius:12px;
  background:linear-gradient(100deg,#008751,#059669);
  color:white;font-size:15px;font-weight:800;
  margin-top:23px;cursor:pointer
}
button:disabled{opacity:.55;cursor:wait}
.note{
  margin-top:18px;padding:13px;border-radius:12px;
  background:#0a0f0d;color:#a7b5ac;
  font-size:12px;line-height:1.6
}
#status{
  display:none;margin-top:16px;padding:13px;
  border-radius:12px;font-size:13px;line-height:1.6;
  overflow-wrap:anywhere
}
#status.ok{display:block;background:#063c29;color:#a7f3d0}
#status.bad{display:block;background:#451b1b;color:#fecaca}
.small{color:#84948a;font-size:11px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="logo">T</div>
  <h1>TCK Email Tester</h1>
  <p class="sub">
    Test your email connection by sending a real four-digit code
    directly to a receiving inbox.
  </p>

  <form id="email-form">
    <label for="sender">Sender Gmail address</label>
    <input id="sender" type="email" autocomplete="email"
      placeholder="youraccount@gmail.com" required maxlength="254">

    <label for="app-password">Gmail App Password</label>
    <input id="app-password" type="password"
      autocomplete="new-password"
      placeholder="Enter your 16-character App Password"
      required maxlength="256">

    <label for="recipient">Receiving email address</label>
    <input id="recipient" type="email"
      placeholder="recipient@example.com" required maxlength="254">

    <button id="send-button" type="submit">
      SEND TEST CODE
    </button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <div class="note">
    <strong>Privacy:</strong> Your App Password is used for this
    sending attempt only. It is not saved to a file or database.
    Never enter your normal Gmail password here.
  </div>

  <p class="small">TCK TOKEN • DEVELOPMENT EMAIL TEST</p>
</main>

<script>
const form = document.getElementById("email-form");
const button = document.getElementById("send-button");
const statusBox = document.getElementById("status");
const passwordInput = document.getElementById("app-password");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  statusBox.className = "";
  statusBox.style.display = "none";
  button.disabled = true;
  button.textContent = "SENDING EMAIL...";

  try {
    const response = await fetch("/send-test", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        sender: document.getElementById("sender").value.trim(),
        app_password: passwordInput.value,
        recipient: document.getElementById("recipient").value.trim()
      })
    });

    const result = await response.json();

    statusBox.className = result.ok ? "ok" : "bad";
    statusBox.textContent = result.message || result.error ||
      "The email test failed.";
    statusBox.style.display = "block";

    if (result.ok) {
      passwordInput.value = "";
    }
  } catch (error) {
    statusBox.className = "bad";
    statusBox.textContent =
      "Could not reach the email server. Check that it is running.";
    statusBox.style.display = "block";
  } finally {
    button.disabled = false;
    button.textContent = "SEND TEST CODE";
  }
});
</script>
</body>
</html>
